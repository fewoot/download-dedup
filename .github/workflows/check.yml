name: Syntax Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check userscript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run syntax check
        run: npm run check
